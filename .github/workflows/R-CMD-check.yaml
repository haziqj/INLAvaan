# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) ${{ matrix.config.label }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {
              os: ubuntu-latest,
              r: 'release',
              label: '(lavaan devel)',
              lavaan: 'devel',
              force_suggests: 'false',
              build_args: 'c("--no-manual", "--no-build-vignettes")',
              check_args: 'c("--no-manual", "--as-cran", "--ignore-vignettes")'
            }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.force_suggests || 'true' }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install lavaan devel from GitHub
        if: matrix.config.lavaan == 'devel'
        run: |
          try(remove.packages("blavaan"), silent = TRUE)
          pak::pak("yrosseel/lavaan")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: ${{ matrix.config.build_args || 'c("--no-manual")' }}
          args: ${{ matrix.config.check_args || 'c("--no-manual", "--as-cran")' }}
          error-on: '"warning"'
